services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: suppliers
      POSTGRES_PASSWORD: suppliers
      POSTGRES_DB: suppliers
    ports:
      - "5432:5432"
    volumes:
      - nodo_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  nodo_postgres_data:
